name: Build WhatsApp catalog feed

# Rebuilds whatsapp_feed.csv (Meta Commerce Manager data feed for the
# WhatsApp Business catalog) whenever the product database changes.
# Meta reads it daily from:
#   https://raw.githubusercontent.com/merlinmarina/merlinmarina.github.io/main/whatsapp_feed.csv

on:
  push:
    branches: [main]
    paths:
      - data/products.json
      - scripts/build_whatsapp_feed.py
      - .github/workflows/whatsapp-feed.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  # Which products go to WhatsApp. TEST RUN: 5 Aqua Filters.
  # Remove the arguments (leave empty) to publish the whole active catalog.
  FEED_ARGS: --category "Aqua Filters" --limit 5

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: eval python3 scripts/build_whatsapp_feed.py --check-images $FEED_ARGS
      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add whatsapp_feed.csv
          git diff --cached --quiet || git commit -m "Update WhatsApp catalog feed"
          git pull --rebase origin main
          git push
